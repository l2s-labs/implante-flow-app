name: Publicar APK (desenvolvimento)

on:
  push:
    branches: [stage]
  pull_request:
    branches: [stage]
  workflow_dispatch:

concurrency:
  group: apk-develop-${{ github.workflow }}-${{ github.ref }}
  # Nunca cancelar no meio: evita bump publicado sem release (build number pulado).
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Desenvolvimento
    permissions:
      contents: write
    uses: ./.github/workflows/apk-build.yml
    with:
      environment_name: development
      prerelease: true
      channel: dev
      # Bump em push/dispatch na stage; PR só compila sem alterar o pubspec.
      bump_version: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
